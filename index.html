<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><meta name="theme-color" content="#0f5c6e"><title>L.L Bicycle Center – Daily Ledger</title>
<style>
:root{--bg:#f2f6f4;--card:#fff;--fg:#14231e;--mut:#5f7169;--line:#cfdad5;--acc:#0f5c6e;--in:#1f7a4d;--out:#b3392f;--hl:#e6f0ec;--onacc:#fff;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0b;--card:#151516;--fg:#f4f4f5;--mut:#a1a1a6;--line:#2e2e32;--acc:#f4f4f5;--in:#4ade80;--out:#ff5c5c;--hl:#1f1f22;--onacc:#0a0a0b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0a0b;--card:#151516;--fg:#f4f4f5;--mut:#a1a1a6;--line:#2e2e32;--acc:#f4f4f5;--in:#4ade80;--out:#ff5c5c;--hl:#1f1f22;--onacc:#0a0a0b;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:920px;margin:0 auto;padding:14px}
h1{font:700 21px Georgia,"Times New Roman",serif;margin:0}
h2{font:700 16px Georgia,serif;margin:18px 0 8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}
.tabs{display:flex;border:1px solid var(--line);border-radius:8px;overflow-x:auto;background:var(--card)}
.tabs button{flex:1 0 auto;border:0;background:none;color:var(--fg);padding:10px 12px;min-height:44px;font:inherit;font-weight:600;cursor:pointer}
.tabs button.hot{color:var(--out)}
.tabs button[aria-selected="true"]{background:var(--acc);color:var(--onacc)}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:12px 0}
button,input,select{font:inherit;color:var(--fg);touch-action:manipulation}
input,select{border:1px solid var(--line);background:var(--card);padding:8px;border-radius:7px;min-width:0;min-height:44px;font-size:16px}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;min-height:44px;border-radius:7px;cursor:pointer}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:600}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.bar input[type=date],.bar input[type=month],.bar input[type=search]{flex:1 1 140px}
#cloud input{flex:1 1 150px}
.form{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.form label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat small{color:var(--mut);display:block}
.stat b{font:700 19px Georgia,serif;font-variant-numeric:tabular-nums}
.in{color:var(--in)}.out{color:var(--out)}.low{color:var(--out);font-weight:700}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
tbody tr:nth-child(even){background:var(--hl)}
th{font-size:13px;color:var(--mut);font-weight:600;border-bottom:2px solid var(--line)}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:0}
.x{border:0;background:none;color:var(--out);cursor:pointer;font-size:16px;min-width:44px;min-height:44px}
.empty{padding:22px;text-align:center;color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.go{cursor:pointer}
input[type=number]{-moz-appearance:textfield;appearance:textfield}input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.sm{width:92px;text-align:right}
input[readonly]{background:var(--hl);color:var(--mut)}
.plist{min-width:0;font-size:14px}.plist th,.plist td{padding:2px 6px;border-right:1px solid var(--line)}.plist tbody tr:nth-child(even){background:var(--hl)}.plist td.pname{white-space:normal;min-width:180px;font-weight:600}.plist input.sm{width:72px;padding:2px 5px;min-height:0;height:28px;font-size:13px}
.sg{position:absolute;left:0;right:0;top:100%;z-index:5;background:var(--card);border:1px solid var(--line);border-radius:7px;max-height:60vh;overflow:auto;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.sg:empty{display:none}
.sg button{display:flex;justify-content:space-between;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:14px 12px;font-size:16px;text-align:left;cursor:pointer;color:var(--fg)}
.sg .hint{padding:12px;color:var(--mut)}
.big{font-size:18px;min-height:54px}
.sg button:hover,.sg button:focus{background:var(--hl)}
.bike{display:grid;grid-template-columns:auto 1fr auto;gap:8px 14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
.bt{font:700 28px Georgia,serif;min-width:70px;text-align:center;border:2px solid var(--acc);border-radius:8px;padding:4px 8px;color:var(--acc)}
.bd{display:flex;flex-wrap:wrap;gap:2px 16px}.bd b{flex-basis:100%;font-size:16px}.bd span{color:var(--mut)}
.badge{font-weight:700}
.bk{display:flex;gap:6px;flex-wrap:wrap}
.foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.note{color:var(--mut);font-size:13px}
details.mon{background:var(--card);border:1px solid var(--line);border-radius:10px;margin:8px 0;padding:0 12px}.mon summary{display:flex;justify-content:space-between;gap:4px 12px;padding:12px 0;cursor:pointer;flex-wrap:wrap}.mon .bar{margin:0 0 8px}.mon .wrap{margin-bottom:12px}
.alertbar{background:var(--hl);border:1px solid var(--out);color:var(--out);border-radius:10px;padding:10px 12px;margin-bottom:12px;cursor:pointer;font-weight:600}
.sales{min-width:640px;font-size:14px}.sales th,.sales td{padding:7px 9px;border-right:1px solid var(--line)}.sales thead th{background:var(--card)}
.sales td[data-label=Item],.sales td[data-label=Note]{max-width:220px;overflow:hidden;text-overflow:ellipsis}
input[type=checkbox]{min-height:0;width:20px;height:20px;padding:0;flex:none}
.dlbox{flex:1 1 100%}.dlbox summary{display:inline-flex;align-items:center;list-style:none;cursor:pointer}.dlbox summary::-webkit-details-marker{display:none}
.dlrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin:10px 0}.dlrow label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
.dlt{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--card);margin:8px 0}.dlt.off .chips{opacity:.45}
.chips{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:8px}.chip{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--fg)}
.locked #tabs,.locked #view,.locked .foot,.locked .note,.att .foot{display:none}
@media (max-width:640px){
main{padding:10px}h1{font-size:18px}
.tabs button{font-size:13px;padding:10px 9px}
.form{grid-template-columns:repeat(2,1fr)}.s2,.s3,.s4,.s5,.s6{grid-column:span 2}
.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}
.bike{grid-template-columns:auto 1fr}.bk{grid-column:1/-1}.btnc{grid-column:span 2}
.stack{min-width:0}.stack thead{display:none}
.stack tbody tr{display:block;margin:8px;border:1px solid var(--line);border-radius:10px;background:var(--card)}
.stack tbody tr:nth-child(even){background:var(--hl)}
.stack td{display:flex;justify-content:space-between;align-items:center;gap:12px;white-space:normal;text-align:right;border-bottom:1px solid var(--line);padding:8px 12px}
.stack td:empty{display:none}.stack td:last-child{border-bottom:0;justify-content:flex-end}
.stack td::before{content:attr(data-label);color:var(--mut);font-size:13px;text-align:left}
.stack td.pname{font-weight:700;justify-content:flex-start}
.stack td.pname::before,.stack td.empty::before,.stack tfoot td::before{content:none}
.stack td.empty{display:block;text-align:center}
.stack tfoot tr{display:flex;justify-content:space-between;padding:8px 12px}
.stack tfoot td{display:block;border:0;padding:0}
.wrap:has(.stack){background:none;border:0}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
</head>
<body>
<main>
  <div class="top"><h1>L.L Bicycle Center · Daily Ledger</h1><button class="btn" id="theme" aria-label="Switch light or dark">◐</button></div>
  <div class="bar" id="cloud"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="view"></div>
  <div class="foot">
    <details class="dlbox" id="dlbox"><summary class="btn">Download tables (Excel)</summary><div id="dlpanel"></div></details>
    <button class="btn" id="bk">Save backup</button>
    <button class="btn" id="rs">Restore backup</button>
    <input type="file" id="file" accept=".json" hidden>
  </div>
  <p class="note">Entries are saved on this device first. When signed in, they also sync to the cloud. Saving a backup file now and then is still a good habit.</p>
</main>
<script>
(function(){
var KEY="ll_ledger_v1",PKEY="ll_products_v1",BKEY="ll_bikes_v1",VKEY="ll_voided_v1",LBK="ll_lastbackup_v1",CCK="ll_close_v1",METHODS=["Cash","MTN Mobile Money","Airtel Money","Credit"];
var S={entries:[],voided:[],products:[],bikes:[],view:"day",date:ymd(new Date()),form:{type:"Sale",method:"Cash"},role:"admin",pickBike:null,bq:"",pq:"",bf:"Available",editBike:null};
function lsGet(k){try{var r=localStorage.getItem(k);return r?JSON.parse(r)||[]:[]}catch(e){return[]}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){alert("Could not save in this browser. Download a backup now.")}}
function load(){S.voided=lsGet(VKEY);S.entries=lsGet(KEY);S.products=lsGet(PKEY);S.bikes=lsGet(BKEY)}
function saveV(){lsSet(VKEY,S.voided)}function save(){lsSet(KEY,S.entries)}function saveP(){lsSet(PKEY,S.products)}function saveB(){lsSet(BKEY,S.bikes)}
function cp(c,o){if(window.LLCloud&&o)window.LLCloud.put(c,o)}
function cd(c,id){if(window.LLCloud)window.LLCloud.del(c,id)}
var adm=function(){return S.role==="admin"};
function ymd(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function pd(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(s,n){var d=pd(s);d.setDate(d.getDate()+n);return ymd(d)}
function monday(s){var d=pd(s);d.setDate(d.getDate()-(d.getDay()+6)%7);return ymd(d)}
function money(n){return Math.round(+n||0).toLocaleString("en-US")}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function dfull(s){return pd(s).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",year:"numeric"})}
function dlabel(s){return pd(s).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}
function opts(arr,sel){return arr.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+x+'</option>'}).join("")}
function prodOf(id){return S.products.find(function(x){return x.id===id})}
function bikeOf(id){return S.bikes.find(function(x){return x.id===id})}
function bikeDesc(b){return [b.brand,b.color,b.size].filter(Boolean).join(" ")}
function bikeLabel(b){return "Bike "+b.tag+" · "+bikeDesc(b)}
function norm(s){var x=String(s==null?"":s).toLowerCase();try{x=x.normalize("NFD").replace(/[\u0300-\u036f]/g,"")}catch(e){}try{return x.replace(/[^\p{L}\p{N}]+/gu," ").trim()}catch(e){return x.replace(/[^a-z0-9]+/g," ").trim()}}
function match(text,q){var t=norm(q).split(" ").filter(Boolean),x=norm(text);if(!t.length)return true;return t.every(function(w){return x.indexOf(w)>-1})||x.replace(/ /g,"").indexOf(t.join(""))>-1}
function score(text,q){var t=norm(q).split(" ").filter(Boolean),x=norm(text);return t.filter(function(w){return x.indexOf(w)>-1}).length}
function bikeText(b){return [b.tag,b.brand,b.color,b.size,b.note].join(" ").toLowerCase()}
function tot(e){return (+e.qty||0)*(+e.price||0)}
function cst(e){if(e.type!=="Sale")return 0;var c=+e.cost||0;if(!c){var o=e.bikeId?bikeOf(e.bikeId):e.productId?prodOf(e.productId):null;c=o?+o.cost||0:0}return (+e.qty||0)*c}
function stockOf(id){var p=prodOf(id),n=p?+p.open||0:0;S.entries.forEach(function(e){if(e.productId===id){if(e.type==="Sale")n-=+e.qty||0;else if(e.type==="Restock")n+=+e.qty||0}});return n}
function inRange(a,b){return S.entries.filter(function(e){return e.date>=a&&e.date<=b})}
function sum(list){
  var r={sales:0,exp:0,cost:0,count:0,costKnown:true,by:{},top:{}};
  list.forEach(function(e){
    var t=tot(e);
    if(e.type==="Sale"){r.sales+=t;r.cost+=cst(e);r.count++;if(!(cst(e)>0))r.costKnown=false;
      r.by[e.method]=(r.by[e.method]||0)+t;
      var k=(e.item||"").trim().toLowerCase();if(k){var o=r.top[k]||(r.top[k]={name:e.item.trim(),qty:0,amt:0});o.qty+=+e.qty||0;o.amt+=t}}
    else if(e.type==="Payment")r.paid=(r.paid||0)+t;
    else r.exp+=t});
  r.profit=r.sales-r.cost;r.net=r.sales-r.exp;return r}
function stats(r){
  if(!adm())return '<div class="stats"><div class="stat"><small>Sales</small><b class="in">'+money(r.sales)+'</b></div><div class="stat"><small>Sales made</small><b>'+r.count+'</b></div></div>';
  return '<div class="stats"><div class="stat"><small>Sales</small><b class="in">'+money(r.sales)+'</b></div>'+
  '<div class="stat"><small>Expenses (restock, other)</small><b class="out">'+money(r.exp)+'</b></div>'+
  '<div class="stat"><small>Sales minus expenses</small><b class="'+(r.net<0?"out":"in")+'">'+money(r.net)+'</b></div>'+
  '<div class="stat"><small>Profit on goods sold'+(r.costKnown?'':' (some costs missing)')+'</small><b>'+money(r.profit)+'</b></div></div>'}
function extras(r){
  var by=Object.keys(r.by).map(function(k){return '<tr><td>'+esc(k)+'</td><td class="n">'+money(r.by[k])+'</td></tr>'}).join("");
  var top=Object.keys(r.top).map(function(k){return r.top[k]}).sort(function(a,b){return b.amt-a.amt}).slice(0,8).map(function(o){return '<tr><td>'+esc(o.name)+'</td><td class="n">'+o.qty+'</td><td class="n">'+money(o.amt)+'</td></tr>'}).join("");
  return '<div class="two"><div><h2>Sales by payment</h2><div class="wrap"><table style="min-width:0"><tbody>'+(by||'<tr><td class="empty">No sales yet</td></tr>')+'</tbody></table></div></div>'+
  '<div><h2>Best-selling items</h2><div class="wrap"><table style="min-width:0"><thead><tr><th>Item</th><th class="n">Qty</th><th class="n">Amount</th></tr></thead><tbody>'+(top||'<tr><td colspan="3" class="empty">No sales yet</td></tr>')+'</tbody></table></div></div></div>'}

function formHTML(){
  var f=S.form,a=adm(),sale=f.type==="Sale",res=f.type==="Restock",pay=f.type==="Credit payment";
  var ph=sale?"Search: tube 26 black front, or bike tag 020":res?"Search a product to restock":pay?"Customer name (pick from the list)":"e.g. Rent, transport";
  var L=function(c,t,x){return '<label class="'+c+'">'+t+x+'</label>'};
  var one=a?"s1":"s2";
  var h='<form class="form" id="f" onsubmit="return false">';
  h+='<label class="s6" style="position:relative">'+(sale||res?"Item (type any words of the name)":pay?"Customer":"Description")+'<div id="sg" class="sg"></div><input id="it" class="big" required autocomplete="off" placeholder="'+ph+'"></label>';
  if(res)h+='<div class="s6 note prev" id="prev">Pick a product to see its current prices. Change a price only if it is different.</div>';
  if(a)h+=L("s1","Type",'<select id="ty">'+opts(["Sale","Restock","Expense","Credit payment"],f.type)+'</select>');
  h+=L(one,res||sale?"Qty":"Qty (optional)",'<input id="q" type="number" min="0" step="any" value="1" inputmode="decimal">');
  h+=L(one,sale?"Selling price each":res?"Buying cost each":pay?"Amount paid":"Amount",'<input id="p" type="number" min="0" step="any" inputmode="decimal" required>');
  if(res&&a)h+=L("s1","New selling price",'<input id="ps2" type="number" min="0" step="any" inputmode="decimal" placeholder="same">');
  if(sale&&a)h+=L("s1","Buying cost each",'<input id="c" type="number" min="0" step="any" inputmode="decimal">');
  h+=L(a?(sale||res?"s2":"s3"):"s2","Paid with",sale?'<select id="m">'+opts(METHODS,f.method)+'</select>':'<select id="m2">'+opts(METHODS.slice(0,3),f.method)+'</select>');
  h+=L("s5","Note (customer name for credit)",'<input id="nt">');
  return h+'<div class="btnc" style="align-self:end"><button class="btn pri" id="add" style="width:100%">Add entry</button></div></form>'}

var CMETH=["Cash","MTN Mobile Money","Airtel Money"];
function ccGet(){try{return JSON.parse(localStorage.getItem(CCK))||{}}catch(e){return{}}}
function ccSet(o){try{localStorage.setItem(CCK,JSON.stringify(o))}catch(e){}}
function closeExpected(list){var ex={};CMETH.forEach(function(m){ex[m]=0});var cr=0;
  list.forEach(function(e){var t=tot(e);if(e.type==="Sale"&&e.method==="Credit"){cr+=t;return}if(!(e.method in ex))return;
    if(e.type==="Sale"||e.type==="Payment")ex[e.method]+=t;else ex[e.method]-=t});return{ex:ex,credit:cr}}
function diffTxt(d){return d===0?'<span class="in">Matches</span>':'<span class="'+(d<0?"out":"in")+'">'+(d>0?"+":"")+money(d)+(d<0?" short":" over")+'</span>'}
function closeHTML(list){if(!adm())return "";var c=closeExpected(list),saved=ccGet()[S.date]||{};
  var rows=CMETH.map(function(m,i){var v=saved[m],has=v!==undefined&&v!=="";
    return '<tr><td>'+m+'</td><td class="n">'+money(c.ex[m])+'</td><td class="n"><input class="sm" id="cc'+i+'" data-cc="'+m+'" type="number" min="0" step="any" inputmode="decimal" value="'+(has?esc(v):"")+'" placeholder="count"></td><td class="n" id="ccd'+i+'">'+(has?diffTxt((+v||0)-c.ex[m]):"")+'</td></tr>'}).join("");
  return '<details class="mon" id="closebox"'+(S.closeOpen?' open':'')+'><summary><b>Close the day: count the money</b><span>'+dlabel(S.date)+'</span></summary><div class="wrap"><table style="min-width:0"><thead><tr><th>Paid with</th><th class="n">Should have</th><th class="n">You counted</th><th class="n">Difference</th></tr></thead><tbody>'+rows+'</tbody></table></div><p class="note">Should have = sales and credit payments received, minus expenses and restocks paid that way, for this date. Credit sales today: '+money(c.credit)+' (not counted). Counts are kept on this device.</p></details>'}
function earlierDays(){var a=adm(),days={};
  S.entries.forEach(function(e){if(e.date===S.date||(!a&&e.type!=="Sale"))return;(days[e.date]||(days[e.date]=[])).push(e)});
  var ds=Object.keys(days),before=ds.filter(function(d){return d<S.date}).sort().reverse(),after=ds.filter(function(d){return d>S.date}).sort();
  var row=function(d){var r=sum(days[d]);return '<tr><td>'+dfull(d)+'</td><td class="n">'+r.count+'</td><td class="n in">'+money(r.sales)+'</td><td><button class="btn" data-open="'+d+'">Open</button></td></tr>'};
  var h='<h2>Other days</h2><div class="bar"><label class="note" style="display:flex;align-items:center;gap:8px">Go to any date <input type="date" id="dt" value="'+S.date+'"></label></div>';
  if(!before.length&&!after.length)return h+'<div class="wrap"><div class="empty">No other days recorded yet.</div></div>';
  return h+'<div class="wrap"><table style="min-width:0"><thead><tr><th>Day</th><th class="n">Sales made</th><th class="n">Sales</th><th></th></tr></thead><tbody>'+before.slice(0,30).map(row).join("")+after.map(row).join("")+'</tbody></table></div>'+(before.length>30?'<p class="note">Showing the latest 30 earlier days. Use “Go to any date” or the History tab for older days.</p>':'')}
function dayView(){
  var list=S.entries.filter(function(e){return e.date===S.date&&(adm()||e.type==="Sale")}).sort(function(a,b){return b.id-a.id});
  var r=sum(list),a=adm();
  var today=ymd(new Date()),isT=S.date===today;
  var h='<h2 style="margin:4px 0 10px">'+(isT?'Today · ':'Ledger · ')+dfull(S.date)+'</h2>'+(isT?'':'<div class="bar"><button class="btn pri" data-d="0">‹ Back to today</button></div>');
  h+=stats(r)+alertBar()+bkBar()+formHTML()+closeHTML(list);

function renderDl(){
  var P=[["today","Today"],["week","This week"],["month","This month"],["last","Last month"],["all","All time"]];
  var h='<div class="dlrow"><label>Period<select id="dlp">'+P.map(function(x){return '<option value="'+x[0]+'"'+(x[0]===DLS.period?' selected':'')+'>'+x[1]+'</option>'}).join("")+'</select></label><label>File type<select id="dlf"><option value="xlsx"'+(DLS.fmt==="xlsx"?' selected':'')+'>Excel workbook (one sheet per table)</option><option value="csv"'+(DLS.fmt==="csv"?' selected':'')+'>CSV (one file per table)</option></select></label><label>Only products and bicycles matching these words (optional)<input id="dlq" value="'+esc(DLS.q)+'" placeholder="e.g. tube 26 black" autocomplete="off"></label></div><p class="note">Tick the tables you need, and the columns in each. Period applies to Sales, Restocks, Expenses and Daily totals. The words box narrows Products and Bicycles.</p>';
  Object.keys(DLT).forEach(function(id){var t=DLS.t[id];h+='<div class="dlt'+(t.on?'':' off')+'"><label class="chip"><input type="checkbox" data-dt="'+id+'"'+(t.on?' checked':'')+'> <b>'+DLT[id].title+'</b></label><div class="chips">'+DLT[id].cols.map(function(c){return '<label class="chip"><input type="checkbox" data-dc="'+id+'" value="'+c[0]+'"'+(t.cols.indexOf(c[0])>-1?' checked':'')+'> '+c[1]+'</label>'}).join("")+'</div></div>'});
  document.getElementById("dlpanel").innerHTML=h+'<div class="bar"><button class="btn pri" id="dlgo">Download</button><span id="dlmsg" class="note"></span></div>'}
function csvText(t){var q=function(v){return '"'+String(v==null?"":v).replace(/"/g,'""')+'"'};return [t.head].concat(t.rows).map(function(r){return r.map(q).join(",")}).join("\r\n")}
async function saveFile(name,data){
  var blob=data instanceof Blob?data:new Blob([data]);
  try{if(window.claude&&window.claude.use){var d=await window.claude.use("downloads");if(d){await d.save({filename:name,data:blob});return}}}catch(e){if(e&&e.code==="declined")throw e}
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(a.href)},4000)}
async function runDl(only,q,per,label,extra){
  var msg="",out=[];
  Object.keys(DLT).forEach(function(id){var t=DLS.t[id];if(only?id!==only:!(t.on||(extra&&extra.indexOf(id)>-1)))return;var cols=DLT[id].cols.filter(function(c){return t.cols.indexOf(c[0])>-1});if(!cols.length)return;
    out.push({title:DLT[id].title,head:cols.map(function(c){return c[1]}),rows:DLT[id].rows(per||DLS.period,q!=null?q:DLS.q).map(function(r){return cols.map(function(c){return c[2](r)})})})});
  if(!out.length)return "Tick at least one table and one column.";
  var fmt=DLS.fmt,stamp=ymd(new Date()),pre=only==="products"?"ledger-stock-":"ledger-";
  if(fmt==="xlsx"&&!window.XLSX){fmt="csv";msg="The Excel tool did not load (are you offline?). Downloaded CSV instead. "}
  try{
    if(fmt==="xlsx"){var wb=XLSX.utils.book_new();out.forEach(function(t){XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet([t.head].concat(t.rows)),t.title)});
      await saveFile(pre+(label||stamp)+".xlsx",new Blob([XLSX.write(wb,{bookType:"xlsx",type:"array"})]))}
    else for(var i=0;i<out.length;i++)await saveFile(pre+out[i].title.toLowerCase().replace(/\W+/g,"-")+"-"+(label||stamp)+".csv",new Blob(["\ufeff"+csvText(out[i])],{type:"text/csv"}));
  }catch(err){return "Download was cancelled or did not work."}
  return msg+"Done."+(out.length===1?" "+out[0].rows.length+" row(s).":"")}
var dlp=document.getElementById("dlpanel");
document.getElementById("dlbox").addEventListener("toggle",function(){if(this.open)renderDl()});
dlp.addEventListener("change",function(e){var t=e.target;
  if(t.id==="dlp")DLS.period=t.value;else if(t.id==="dlf")DLS.fmt=t.value;
  else if(t.dataset.dt){DLS.t[t.dataset.dt].on=t.checked;t.closest(".dlt").classList.toggle("off",!t.checked)}
  else if(t.dataset.dc){var c=DLS.t[t.dataset.dc].cols,i=c.indexOf(t.value);if(t.checked&&i<0)c.push(t.value);if(!t.checked&&i>-1)c.splice(i,1)}
  dlSave()});
dlp.addEventListener("click",function(e){if(e.target.id==="dlgo"){var m=document.getElementById("dlmsg");m.textContent="";runDl().then(function(r){m.textContent=r})}});
dlp.addEventListener("input",function(e){if(e.target.id==="dlq"){DLS.q=e.target.value;dlSave()}});
document.getElementById("bk").onclick=function(){markBk();Promise.resolve(dl(JSON.stringify({entries:S.entries,voided:S.voided,products:S.products,bikes:S.bikes}),"ledger-backup-"+ymd(new Date())+".json","application/json")).then(function(){if(S.view==="day")render()})};
document.getElementById("rs").onclick=function(){document.getElementById("file").click()};
document.getElementById("file").onchange=function(e){
  var f=e.target.files[0];if(!f)return;var r=new FileReader();
  r.onload=function(){try{var o=JSON.parse(r.result),a=Array.isArray(o)?o:o.entries;if(!Array.isArray(a))throw 0;
    if(confirm("Replace the current ledger with "+a.length+" entries from this backup?")){S.entries=a;if(o&&Array.isArray(o.products))S.products=o.products;if(o&&Array.isArray(o.bikes))S.bikes=o.bikes;if(o&&Array.isArray(o.voided)){S.voided=o.voided;saveV()}
      if(window.LLCloud){S.entries.forEach(function(x){cp("entries",x)});S.products.forEach(function(x){cp("products",x)});S.bikes.forEach(function(x){cp("bikes",x)});S.voided.forEach(function(x){cp("entries",x)})}
      save();saveP();saveB();render()}}catch(x){alert("That file is not a ledger backup.")}};
  r.readAsText(f);e.target.value=""};
function dl(text,name,type){return saveFile(name,new Blob([text],{type:type}))}
document.getElementById("theme").onclick=function(){var r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};
window.LLApp={S:S,render:render,save:save,saveV:saveV,saveP:saveP,saveB:saveB,setRole:setRole};
load();render();
})();
</script>
<script type="module" src="cloud.js"></script>
